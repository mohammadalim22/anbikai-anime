<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffbeb">
  <meta name="description" content="AnbuKai Anime - Your Anime World">
  <meta name="google-site-verification" content="OK1razUv1UOsWUr0ZHZYsJ2lZ4-r21DB4BDC9Wf1e4E">
  <meta name="monetag" content="2783ebad3dba6e63d23cceeb71df4450">
  <title>AnbuKai Anime — Your Anime World</title>
  <link rel="icon" href="logo.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://graphql.anilist.co">
  <link rel="preconnect" href="https://s4.anilist.co">
  <style>
    :root {
      --bg: #fffbeb;
      --surface: #fffdf5;
      --surface2: #fff4c5;
      --yellow: #ffc800;
      --yellow-dark: #e6ad00;
      --text: #211f19;
      --muted: #777365;
      --border: #e9e2ce;
      --shadow: 0 8px 28px rgba(72, 58, 12, .09);
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid #dca900;
      outline-offset: 3px;
    }
    img { display: block; max-width: 100%; }
    .hidden { display: none !important; }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255,251,235,.96);
      border-bottom: 1px solid rgba(233,226,206,.8);
      backdrop-filter: blur(16px);
    }
    .nav {
      width: min(1400px, 100%);
      margin: auto;
      min-height: 78px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--text);
      text-decoration: none;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
      white-space: nowrap;
    }
    .brand-icon {
      width: 43px;
      height: 43px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--yellow);
      font-size: 23px;
      box-shadow: 0 4px 12px #ffc80035;
    }
    .brand-name { position: relative; }
    .brand-name::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      height: 4px;
      width: 58%;
      background: var(--yellow);
      border-radius: 8px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .nav-btn {
      min-width: 72px;
      padding: 8px 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 700;
      transition: .2s;
    }
    .nav-btn .ico { font-size: 23px; line-height: 1.2; }
    .nav-btn:hover, .nav-btn.active {
      background: var(--surface2);
      color: var(--text);
    }
    .menu-btn {
      display: none;
      border: 0;
      background: var(--yellow);
      border-radius: 12px;
      padding: 10px 13px;
      font-size: 20px;
    }

    /* Search */
    .search-area {
      display: none;
      max-width: 850px;
      padding: 0 20px 16px;
      margin: auto;
    }
    .search-area.open { display: block; }
    .search-box {
      display: flex;
      gap: 8px;
      padding: 7px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: white;
    }
    .search-box input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      padding: 10px;
      color: var(--text);
    }
    .primary-btn {
      border: 0;
      border-radius: 999px;
      background: var(--yellow);
      color: #201c10;
      padding: 12px 20px;
      font-weight: 850;
      transition: transform .2s, background .2s;
    }
    .primary-btn:hover { background: #ffd52e; transform: translateY(-2px); }
    .outline-btn {
      border: 2px solid var(--text);
      border-radius: 999px;
      padding: 11px 18px;
      color: var(--text);
      background: rgba(255,251,235,.75);
      font-weight: 800;
    }

    /* Hero slider */
    .hero-wrap {
      max-width: 1400px;
      padding: 0 18px;
      margin: 0 auto;
    }
    .hero {
      position: relative;
      min-height: 520px;
      height: min(60vw, 650px);
      max-height: 650px;
      overflow: hidden;
      border-radius: 0 0 24px 24px;
      background: #eee5c8;
      isolation: isolate;
    }
    .hero-bg {
      position: absolute;
      z-index: -3;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 28%;
      transition: opacity .35s;
    }
    .hero::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255,251,235,.98) 0%, rgba(255,251,235,.86) 28%, rgba(255,251,235,.36) 57%, rgba(255,251,235,.04) 100%),
        linear-gradient(0deg, rgba(255,251,235,.95), transparent 45%);
    }
    .hero-content {
      position: relative;
      z-index: 1;
      width: min(540px, 60%);
      padding: clamp(35px, 6vw, 80px) 0 65px 28px;
      animation: appear .4s ease;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(9px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 15px;
      font-size: 14px;
      font-weight: 800;
      color: #554b29;
    }
    .hero-meta span { white-space: nowrap; }
    .rating { color: #292416; }
    .hero h1 {
      margin: 0 0 17px;
      font-size: clamp(30px, 4.5vw, 56px);
      line-height: 1.08;
      font-weight: 950;
      letter-spacing: -1.5px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .hero-desc {
      max-width: 440px;
      margin: 0 0 25px;
      color: #6d6756;
      font-size: clamp(14px, 1.6vw, 18px);
      line-height: 1.7;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .hero-actions button { font-size: 16px; }
    .hero-dots {
      position: absolute;
      z-index: 3;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 9px;
    }
    .dot {
      width: 10px;
      height: 10px;
      padding: 0;
      border: 0;
      border-radius: 99px;
      background: #c8c4b6;
      transition: .25s;
    }
    .dot.active { width: 32px; background: var(--yellow); }

    /* Main sections */
    .container {
      width: min(1400px, 100%);
      margin: auto;
      padding: 30px 24px 55px;
    }
    .section { margin: 0 0 42px; scroll-margin-top: 100px; }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 20px;
    }
    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(23px, 3vw, 31px);
      font-weight: 900;
      letter-spacing: -.7px;
      margin: 0;
    }
    .section-title::before {
      content: "";
      width: 6px;
      height: 30px;
      border-radius: 99px;
      background: var(--yellow);
    }
    .section-actions { display: flex; gap: 7px; }
    .icon-btn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      font-size: 22px;
    }
    .icon-btn:hover { background: var(--yellow); border-color: var(--yellow); }
    .anime-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 22px 17px;
    }
    .anime-card { min-width: 0; cursor: pointer; }
    .poster-wrap {
      position: relative;
      overflow: hidden;
      aspect-ratio: 3 / 4.2;
      border-radius: 19px;
      background: #eee7d5;
      box-shadow: var(--shadow);
      transition: transform .25s, box-shadow .25s;
    }
    .anime-card:hover .poster-wrap {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px #6e591f20;
    }
    .poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .35s;
    }
    .anime-card:hover .poster { transform: scale(1.04); }
    .score {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 7px 10px;
      border-radius: 9px;
      background: var(--yellow);
      font-size: 13px;
      font-weight: 900;
      box-shadow: 0 3px 9px #0002;
    }
    .save-card {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 11px;
      background: #1717179c;
      color: white;
      font-size: 19px;
      backdrop-filter: blur(5px);
    }
    .save-card.saved { color: var(--yellow); }
    .card-info { padding-top: 11px; }
    .card-title {
      margin: 0 0 7px;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.6;
    }
    .status-msg {
      padding: 30px 15px;
      text-align: center;
      color: var(--muted);
      background: #fffdf5aa;
      border: 1px dashed var(--border);
      border-radius: 16px;
      grid-column: 1 / -1;
    }
    .loader {
      width: 30px;
      height: 30px;
      border: 3px solid var(--border);
      border-top-color: var(--yellow-dark);
      border-radius: 50%;
      margin: 0 auto 12px;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Dialog */
    .overlay {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: #211f19a6;
      backdrop-filter: blur(7px);
    }
    .overlay.open { display: flex; }
    .dialog {
      position: relative;
      width: min(750px, 100%);
      max-height: 90dvh;
      overflow: auto;
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 25px 80px #0003;
    }
    .dialog-banner {
      height: 220px;
      object-fit: cover;
      width: 100%;
      background: var(--surface2);
    }
    .dialog-body { padding: 22px; }
    .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: #fffdf0ed;
      font-size: 22px;
    }
    .dialog h2 { margin: 0 0 8px; font-size: 27px; }
    .dialog p { color: var(--muted); line-height: 1.75; }
    .dialog-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .watch-video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #151515;
      border: 0;
      border-radius: 15px;
    }
    .episode-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .episode-btn {
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
    }
    .episode-btn.active, .episode-btn:hover {
      background: var(--yellow);
      border-color: var(--yellow);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 25px 18px 95px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    footer strong { color: var(--text); }

    /* Mobile bottom navigation */
    .mobile-nav { display: none; }

    @media (min-width: 1200px) {
      .hero-content { padding-left: 55px; }
    }
    @media (max-width: 1000px) {
      .anime-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .hero { min-height: 460px; }
      .nav { padding-inline: 18px; }
      .nav-btn { min-width: 62px; padding-inline: 7px; }
    }
    @media (max-width: 700px) {
      .nav { min-height: 72px; padding: 10px 15px; }
      .brand { font-size: 21px; }
      .brand-icon { width: 40px; height: 40px; }
      .nav-links { gap: 0; }
      .nav-links .nav-btn { display: none; }
      .menu-btn { display: block; }
      .nav-links.mobile-open {
        position: absolute;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        top: 68px;
        left: 12px;
        right: 12px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 17px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .nav-links.mobile-open .nav-btn { display: flex; }
      .hero-wrap { padding: 0; }
      .hero {
        height: 620px;
        min-height: 0;
        border-radius: 0;
      }
      .hero-bg { object-position: 60% center; }
      .hero::before {
        background:
          linear-gradient(0deg, rgba(255,251,235,1) 0%, rgba(255,251,235,.92) 25%, rgba(255,251,235,.55) 52%, rgba(255,251,235,.12) 100%),
          linear-gradient(90deg, rgba(255,251,235,.25), transparent);
      }
      .hero-content {
        position: absolute;
        bottom: 30px;
        left: 0;
        width: 100%;
        padding: 20px 20px 32px;
      }
      .hero h1 { font-size: clamp(30px, 8vw, 42px); max-width: 440px; }
      .hero-desc { font-size: 15px; max-width: 360px; margin-bottom: 18px; }
      .hero-meta { font-size: 12px; gap: 7px; margin-bottom: 11px; }
      .hero-actions button { font-size: 15px; padding: 12px 17px; }
      .hero-dots { bottom: 13px; }
      .container { padding: 25px 15px 40px; }
      .section { margin-bottom: 34px; }
      .section-head { margin-bottom: 17px; }
      .section-title { font-size: 24px; }
      .section-title::before { height: 26px; }
      .anime-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 19px 12px; }
      .poster-wrap { border-radius: 15px; }
      .score { top: 7px; left: 7px; padding: 6px 7px; font-size: 11px; }
      .save-card { top: 7px; right: 7px; width: 31px; height: 31px; font-size: 16px; }
      .card-info { padding-top: 8px; }
      .card-title { font-size: 14px; }
      .card-meta { font-size: 11px; }
      .mobile-nav {
        position: fixed;
        z-index: 60;
        bottom: 0;
        left: 0;
        right: 0;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        padding: 7px 4px calc(7px + env(safe-area-inset-bottom));
        background: rgba(255,251,235,.97);
        border-top: 1px solid var(--border);
        backdrop-filter: blur(15px);
      }
      .mobile-nav button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        padding: 4px 0;
      }
      .mobile-nav .ico { font-size: 21px; }
      .mobile-nav button.active { color: #201c10; }
      .mobile-nav button.active .ico { color: var(--yellow-dark); }
      footer { padding-bottom: 95px; }
    }
    @media (max-width: 380px) {
      .anime-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero { height: 570px; }
      .hero-actions { gap: 7px; }
      .hero-actions button { font-size: 14px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <nav class="nav">
      <a class="brand" href="#" onclick="showHome();return false;" aria-label="AnbuKai Anime Home">
        <span class="brand-icon">⏵</span>
        <span class="brand-name">AnbuKai</span>
      </a>

      <div class="nav-links" id="navLinks">
        <button class="nav-btn active" onclick="showHome()"><span class="ico">⌂</span>Home</button>
        <button class="nav-btn" onclick="toggleSearch()"><span class="ico">⌕</span>Search</button>
        <button class="nav-btn" onclick="showWatchlist()"><span class="ico">♧</span>Watchlist</button>
        <button class="nav-btn" onclick="showHistory()"><span class="ico">◷</span>History</button>
        <button class="nav-btn" onclick="showLogin()"><span class="ico">♙</span>Login</button>
      </div>
      <button class="menu-btn" onclick="toggleMenu()" aria-label="Open menu">☰</button>
    </nav>

    <div class="search-area" id="searchArea">
      <div class="search-box">
        <input id="searchInput" type="search" placeholder="Search your favourite anime..." autocomplete="off">
        <button class="primary-btn" onclick="searchAnime()">Search</button>
      </div>
    </div>
  </header>

  <main id="homeView">
    <div class="hero-wrap">
      <section class="hero" id="hero">
        <img class="hero-bg" id="heroImage" src="" alt="">
        <div class="hero-content" id="heroContent">
          <div class="loader"></div>
          <div>Loading your anime world...</div>
        </div>
        <div class="hero-dots" id="heroDots"></div>
      </section>
    </div>

    <div class="container">
      <section class="section" id="trendingSection">
        <div class="section-head">
          <h2 class="section-title">Trending Now</h2>
          <div class="section-actions">
            <button class="icon-btn" onclick="scrollCards(-1)" aria-label="Previous anime">‹</button>
            <button class="icon-btn" onclick="scrollCards(1)" aria-label="Next anime">›</button>
          </div>
        </div>
        <div class="anime-grid" id="trendingGrid">
          <div class="status-msg"><div class="loader"></div>Loading trending anime...</div>
        </div>
      </section>

      <section class="section" id="popularSection">
        <div class="section-head"><h2 class="section-title">Popular Anime</h2></div>
        <div class="anime-grid" id="popularGrid">
          <div class="status-msg">Loading popular anime...</div>
        </div>
      </section>
    </div>
  </main>

  <main class="container hidden" id="listView">
    <section class="section">
      <div class="section-head">
        <h2 class="section-title" id="listTitle">Your Anime</h2>
        <button class="outline-btn" onclick="showHome()">← Home</button>
      </div>
      <div class="anime-grid" id="listGrid"></div>
    </section>
  </main>

  <main class="container hidden" id="searchView">
    <section class="section">
      <div class="section-head"><h2 class="section-title">Search Results</h2></div>
      <div class="anime-grid" id="searchGrid"></div>
    </section>
  </main>

  <footer>
    <strong>AnbuKai Anime</strong><br>
    Your Anime World · Made for Anime Fans
  </footer>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <button class="active" onclick="showHome()"><span class="ico">⌂</span>Home</button>
    <button onclick="toggleSearch()"><span class="ico">⌕</span>Search</button>
    <button onclick="showWatchlist()"><span class="ico">♧</span>Watchlist</button>
    <button onclick="showHistory()"><span class="ico">◷</span>History</button>
    <button onclick="showLogin()"><span class="ico">♙</span>Login</button>
  </nav>

  <div class="overlay" id="overlay" onclick="overlayClick(event)">
    <div class="dialog" id="dialog">
      <button class="close-btn" onclick="closeDialog()" aria-label="Close">×</button>
      <div id="dialogContent"></div>
    </div>
  </div>

  <script>
    const API = "https://graphql.anilist.co";

    const QUERY = `
      query ($page: Int, $perPage: Int, $sort: [MediaSort], $search: String) {
        Page(page: $page, perPage: $perPage) {
          media(type: ANIME, sort: $sort, search: $search, isAdult: false) {
            id
            title { romaji english }
            description(asHtml: false)
            coverImage { extraLarge large }
            bannerImage
            episodes
            averageScore
            status
            format
            seasonYear
            genres
            nextAiringEpisode { episode }
          }
        }
      }
    `;

    const VIDEO_DATA = {
      16498: {
        hindi: {
          "Season 1": {
            1: [{
              name: "Server 1",
              embed: "https://pub-b3b8e974b48a4470bcaf08e042ed655e.r2.dev/Attack_on_Titan_%5BHindi%5D_480P_S01_E01.mp4"
            }]
          }
        }
      },
      1735: {
        hindi: {
          "Season 1": {
            1: [{
              name: "Server 1",
              embed: "https://pub-b3b8e974b48a4470bcaf08e042ed655e.r2.dev/Naruto_Shippuden_%5BHindi%5D_480P_S01_E01.mp4"
            }],
            2: [{
              name: "Server 1",
              embed: "https://pub-b3b8e974b48a4470bcaf08e042ed655e.r2.dev/Naruto_Shippuden_%5BHindi%5D_480P_S01_E02.mp4"
            }]
          }
        }
      }
    };

    let animeList = [];
    let heroList = [];
    let heroIndex = 0;
    let heroTimer = null;
    let activeAnime = null;
    let activeEpisode = 1;
    let currentList = [];

    const $ = id => document.getElementById(id);

    async function anilistFetch(variables = {}) {
      const response = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ query: QUERY, variables }),
        signal: AbortSignal.timeout(15000)
      });
      if (!response.ok) throw new Error("Anime data could not be loaded.");
      const json = await response.json();
      if (json.errors) throw new Error("Anime API error.");
      return json.data.Page.media.map(mapAnime);
    }

    function mapAnime(a) {
      return {
        id: a.id,
        title: a.title.english || a.title.romaji || "Unknown Anime",
        romaji: a.title.romaji || "",
        image: a.coverImage.extraLarge || a.coverImage.large || "",
        banner: a.bannerImage || a.coverImage.extraLarge || a.coverImage.large || "",
        score: a.averageScore ? (a.averageScore / 10).toFixed(1) : "N/A",
        episodes: a.episodes || "?",
        status: a.status === "RELEASING" ? "ONGOING" : a.status === "FINISHED" ? "COMPLETED" : (a.status || "ANIME"),
        year: a.seasonYear || "—",
        format: a.format || "ANIME",
        genres: a.genres || [],
        description: cleanText(a.description || "No description available."),
        nextEpisode: a.nextAiringEpisode?.episode || null
      };
    }

    function cleanText(text) {
      const node = document.createElement("div");
      node.innerHTML = text;
      return (node.textContent || node.innerText || "")
        .replace(/\s+/g, " ").trim();
    }

    async function loadHome() {
      try {
        const [trending, popular] = await Promise.all([
          anilistFetch({ page: 1, perPage: 20, sort: ["TRENDING_DESC"] }),
          anilistFetch({ page: 1, perPage: 20, sort: ["POPULARITY_DESC"] })
        ]);

        animeList = [...new Map([...trending, ...popular].map(a => [a.id, a])).values()];
        heroList = trending.slice(0, 5);

        renderHero();
        renderGrid("trendingGrid", trending);
        renderGrid("popularGrid", popular);
        startHeroAuto();
      } catch (error) {
        $("heroContent").innerHTML = `
          <div class="hero-meta">ANBUKAI ANIME</div>
          <h1>Your Anime World</h1>
          <p class="hero-desc">Anime data could not load right now. Please check your internet connection and try again.</p>
          <div class="hero-actions"><button class="primary-btn" onclick="loadHome()">↻ Try Again</button></div>`;
        $("trendingGrid").innerHTML = `<div class="status-msg">Anime load হয়নি। ইন্টারনেট চেক করে আবার চেষ্টা কর।</div>`;
        $("popularGrid").innerHTML = "";
      }
    }

    function renderHero() {
      if (!heroList.length) return;
      const a = heroList[heroIndex];
      $("heroImage").src = a.banner || a.image;
      $("heroImage").alt = a.title;
      $("heroContent").innerHTML = `
        <div class="hero-meta">
          <span class="rating">★ ${a.score}</span>
          <span>${a.status}</span>
          <span>${a.year}</span>
        </div>
        <h1>${escapeHTML(a.title)}</h1>
        <p class="hero-desc">${escapeHTML(a.description)}</p>
        <div class="hero-actions">
          <button class="primary-btn" onclick="openAnime(${a.id})">▶ Watch Now</button>
          <button class="outline-btn" onclick="toggleWatchlist(${a.id})">♧ Watchlist</button>
        </div>`;
      $("heroDots").innerHTML = heroList.map((_, i) =>
        `<button class="dot ${i === heroIndex ? "active" : ""}" onclick="goHero(${i})" aria-label="Slide ${i + 1}"></button>`
      ).join("");
    }

    function goHero(index) {
      heroIndex = index;
      renderHero();
      startHeroAuto();
    }

    function startHeroAuto() {
      clearInterval(heroTimer);
      if (heroList.length > 1) {
        heroTimer = setInterval(() => {
          heroIndex = (heroIndex + 1) % heroList.length;
          renderHero();
        }, 6500);
      }
    }

    function renderGrid(elementId, list) {
      const el = $(elementId);
      if (!list.length) {
        el.innerHTML = `<div class="status-msg">কোনো Anime পাওয়া যায়নি।</div>`;
        return;
      }
      el.innerHTML = list.map(a => `
        <article class="anime-card" onclick="openAnime(${a.id})">
          <div class="poster-wrap">
            <img class="poster" loading="lazy" src="${safeURL(a.image)}" alt="${escapeHTML(a.title)}">
            <span class="score">★ ${a.score}</span>
            <button class="save-card ${isSaved(a.id) ? "saved" : ""}"
              onclick="event.stopPropagation();toggleWatchlist(${a.id});this.classList.toggle('saved',isSaved(${a.id}));"
              aria-label="Add to watchlist">${isSaved(a.id) ? "♥" : "♧"}</button>
          </div>
          <div class="card-info">
            <h3 class="card-title">${escapeHTML(a.title)}</h3>
            <div class="card-meta">${a.year} · ${a.status} · ${a.format}</div>
          </div>
        </article>`).join("");
    }

    function escapeHTML(str) {
      return String(str ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[ch]);
    }

    function safeURL(url) {
      return /^https:\/\//i.test(url || "") ? escapeHTML(url) : "";
    }

    function allAnime() { return animeList; }

    function openAnime(id) {
      const a = allAnime().find(item => item.id === id);
      if (!a) return;
      activeAnime = a;
      $("dialogContent").innerHTML = `
        <img class="dialog-banner" src="${safeURL(a.banner || a.image)}" alt="">
        <div class="dialog-body">
          <div class="hero-meta"><span>★ ${a.score}</span><span>${a.year}</span><span>${a.status}</span></div>
          <h2>${escapeHTML(a.title)}</h2>
          <div class="card-meta">${escapeHTML(a.genres.join(" · "))}</div>
          <p>${escapeHTML(a.description)}</p>
          <div class="dialog-actions">
            <button class="primary-btn" onclick="startWatching(${a.id})">▶ Watch Now</button>
            <button class="outline-btn" onclick="toggleWatchlist(${a.id});openAnime(${a.id})">${isSaved(a.id) ? "♥ Saved" : "♧ Add to Watchlist"}</button>
          </div>
          <p><strong>Episodes:</strong> ${a.episodes}</p>
        </div>`;
      $("overlay").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeDialog() {
      $("overlay").classList.remove("open");
      document.body.style.overflow = "";
    }

    function overlayClick(event) {
      if (event.target === $("overlay")) closeDialog();
    }

    function startWatching(id) {
      const a = allAnime().find(item => item.id === id);
      if (!a) return;
      activeAnime = a;
      activeEpisode = 1;
      addHistory(a.id, 1);
      const video = VIDEO_DATA[a.id]?.hindi?.["Season 1"]?.[1]?.[0];

      $("dialogContent").innerHTML = `
        <div class="dialog-body">
          <h2>${escapeHTML(a.title)}</h2>
          <p>Episode ${activeEpisode} · Hindi</p>
          ${video
            ? `<video class="watch-video" controls playsinline preload="metadata" src="${safeURL(video.embed)}"></video>`
            : `<div class="watch-video" style="display:grid;place-items:center;color:white;padding:20px;text-align:center;">
                 <div><div style="font-size:40px">▶</div><p style="color:#fff">এই Anime-এর ভিডিও এখনো যোগ করা হয়নি।</p><p style="color:#ddd;font-size:13px">Available video links are configured by the site owner.</p></div>
               </div>`}
          <div class="episode-list">
            <button class="episode-btn active" onclick="playEpisode(1)">Episode 1</button>
            ${a.id === 1735 ? `<button class="episode-btn" onclick="playEpisode(2)">Episode 2</button>` : ""}
          </div>
          <div class="dialog-actions">
            <button class="outline-btn" onclick="openAnime(${a.id})">← Anime Details</button>
          </div>
        </div>`;
    }

    function playEpisode(ep) {
      if (!activeAnime) return;
      activeEpisode = ep;
      addHistory(activeAnime.id, ep);
      const video = VIDEO_DATA[activeAnime.id]?.hindi?.["Season 1"]?.[ep]?.[0];
      const content = $("dialogContent");
      if (!video) {
        alert("এই Episode-এর ভিডিও লিংক এখনো যোগ করা হয়নি।");
        return;
      }
      content.innerHTML = `
        <div class="dialog-body">
          <h2>${escapeHTML(activeAnime.title)}</h2>
          <p>Episode ${ep} · Hindi</p>
          <video class="watch-video" controls autoplay playsinline src="${safeURL(video.embed)}"></video>
          <div class="episode-list">
            <button class="episode-btn ${ep === 1 ? "active" : ""}" onclick="playEpisode(1)">Episode 1</button>
            ${activeAnime.id === 1735 ? `<button class="episode-btn ${ep === 2 ? "active" : ""}" onclick="playEpisode(2)">Episode 2</button>` : ""}
          </div>
          <div class="dialog-actions"><button class="outline-btn" onclick="openAnime(${activeAnime.id})">← Anime Details</button></div>
        </div>`;
    }

    function getSaved() {
      try { return JSON.parse(localStorage.getItem("anbukai_watchlist") || "[]"); }
      catch { return []; }
    }
    function isSaved(id) { return getSaved().includes(id); }

    function toggleWatchlist(id) {
      let saved = getSaved();
      saved = saved.includes(id) ? saved.filter(x => x !== id) : [...saved, id];
      localStorage.setItem("anbukai_watchlist", JSON.stringify(saved));
      if (activeAnime && $("overlay").classList.contains("open")) {
        // Refresh detail button text if the detail view is open.
        const btn = $("dialogContent").querySelector(".dialog-actions .outline-btn");
        if (btn && !btn.textContent.includes("Anime Details")) {
          btn.textContent = isSaved(id) ? "♥ Saved" : "♧ Add to Watchlist";
        }
      }
    }

    function addHistory(id, episode) {
      let history = [];
      try { history = JSON.parse(localStorage.getItem("anbukai_history") || "[]"); } catch {}
      history = history.filter(item => item.id !== id);
      history.unshift({ id, episode, date: Date.now() });
      localStorage.setItem("anbukai_history", JSON.stringify(history.slice(0, 50)));
    }

    function showHome() {
      closeDialog();
      $("homeView").classList.remove("hidden");
      $("listView").classList.add("hidden");
      $("searchView").classList.add("hidden");
      $("searchArea").classList.remove("open");
      $("navLinks").classList.remove("mobile-open");
      window.scrollTo({ top: 0, behavior: "smooth" });
      setActiveNav(0);
    }

    function showWatchlist() {
      closeDialog();
      $("homeView").classList.add("hidden");
      $("searchView").classList.add("hidden");
      $("listView").classList.remove("hidden");
      $("listTitle").textContent = "My Watchlist";
      const list = allAnime().filter(a => isSaved(a.id));
      renderGrid("listGrid", list);
      $("navLinks").classList.remove("mobile-open");
      setActiveNav(2);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showHistory() {
      closeDialog();
      $("homeView").classList.add("hidden");
      $("searchView").classList.add("hidden");
      $("listView").classList.remove("hidden");
      $("listTitle").textContent = "Watch History";
      let history = [];
      try { history = JSON.parse(localStorage.getItem("anbukai_history") || "[]"); } catch {}
      const ids = history.map(item => item.id);
      const list = ids.map(id => allAnime().find(a => a.id === id)).filter(Boolean);
      renderGrid("listGrid", list);
      $("navLinks").classList.remove("mobile-open");
      setActiveNav(3);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function toggleSearch() {
      $("searchArea").classList.toggle("open");
      $("navLinks").classList.remove("mobile-open");
      if ($("searchArea").classList.contains("open")) {
        $("searchInput").focus();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      setActiveNav(1);
    }

    async function searchAnime() {
      const query = $("searchInput").value.trim();
      if (!query) return;
      $("homeView").classList.add("hidden");
      $("listView").classList.add("hidden");
      $("searchView").classList.remove("hidden");
      $("searchGrid").innerHTML = `<div class="status-msg"><div class="loader"></div>Searching...</div>`;
      $("navLinks").classList.remove("mobile-open");
      try {
        const results = await anilistFetch({ page: 1, perPage: 24, search: query, sort: ["SEARCH_MATCH"] });
        animeList = [...new Map([...animeList, ...results].map(a => [a.id, a])).values()];
        renderGrid("searchGrid", results);
      } catch {
        $("searchGrid").innerHTML = `<div class="status-msg">Search করা যায়নি। আবার চেষ্টা কর।</div>`;
      }
    }

    function showLogin() {
      $("dialogContent").innerHTML = `
        <div class="dialog-body">
          <h2>Welcome to AnbuKai</h2>
          <p>Login feature is not connected yet. Watchlist and history are saved locally on this device.</p>
          <button class="primary-btn" onclick="closeDialog()">Got it</button>
        </div>`;
      $("overlay").classList.add("open");
      document.body.style.overflow = "hidden";
      $("navLinks").classList.remove("mobile-open");
    }

    function toggleMenu() {
      $("navLinks").classList.toggle("mobile-open");
    }

    function setActiveNav(index) {
      document.querySelectorAll(".nav-links .nav-btn").forEach((b, i) => b.classList.toggle("active", i === index));
      document.querySelectorAll(".mobile-nav button").forEach((b, i) => b.classList.toggle("active", i === index));
    }

    function scrollCards(direction) {
      $("trendingGrid").scrollBy({ left: direction * 300, behavior: "smooth" });
    }

    // Enter key triggers search.
    $("searchInput").addEventListener("keydown", event => {
      if (event.key === "Enter") searchAnime();
    });

    // Close dialog using Escape.
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeDialog();
    });

    // Load anime on page start.
    loadHome();
  </script>
</body>
  </html>
