<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnbiKai Anime</title>
<style>
  :root { --bg:#0f0f13; --card:#1b1b22; --text:#f5f5f5; --muted:#a1a1aa; --accent:#ff4d6d; --border:#2a2a35; --input-bg:#15151c; --score:#f5c518; }
  body.light { --bg:#f7f7fa; --card:#fff; --text:#1a1a1a; --muted:#6b6b76; --border:#e0e0e8; --input-bg:#f2f2f7; --score:#d4a017; }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; position: sticky; top: 0; background: var(--bg); z-index: 50; }
  .logo { font-size: 1.4rem; color: var(--accent); font-weight: bold; }
  .logo small { display: block; color: var(--muted); font-size: 0.7rem; font-weight: normal; margin-top: 2px; }
  .header-buttons { display: flex; gap: 6px; }
  .icon-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 999px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
  .icon-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .controls { max-width: 900px; margin: 16px auto; padding: 0 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .search-wrap { flex: 1; min-width: 220px; position: relative; }
  .search-box { display: flex; gap: 8px; }
  input, select { padding: 11px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); outline: none; font-size: 0.85rem; font-family: inherit; }
  input { flex: 1; width: 100%; }
  select { cursor: pointer; }
  .search-btn { padding: 11px 20px; border-radius: 999px; border: none; background: var(--accent); color: white; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
  .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-top: 6px; max-height: 350px; overflow-y: auto; display: none; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
  .suggestions.active { display: block; }
  .sug-item { display: flex; gap: 10px; padding: 8px 12px; cursor: pointer; align-items: center; border-bottom: 1px solid var(--border); }
  .sug-item:last-child { border-bottom: none; }
  .sug-item:hover, .sug-item.selected { background: var(--input-bg); }
  .sug-item img { width: 40px; height: 55px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .sug-item-info { flex: 1; min-width: 0; }
  .sug-item-info h4 { font-size: 0.82rem; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sug-item-info p { font-size: 0.68rem; color: var(--muted); }
  .sug-loading { padding: 12px; text-align: center; color: var(--muted); font-size: 0.8rem; }
  #status { text-align: center; color: var(--muted); margin: 20px; font-size: 0.9rem; }
  .section-header { max-width: 1200px; margin: 24px auto 0; padding: 0 16px; font-size: 1rem; color: var(--accent); font-weight: bold; display: flex; align-items: center; gap: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid var(--border); }
  .card img { width: 100%; height: 220px; object-fit: cover; display: block; background: var(--input-bg); }
  .card-content { padding: 10px; }
  .card h3 { font-size: 0.88rem; margin-bottom: 6px; }
  .card p { font-size: 0.72rem; color: var(--muted); }
  .score { color: var(--score); font-weight: bold; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; padding: 16px; overflow-y: auto; }
  .modal-overlay.active { display: block; }
  .modal { background: var(--card); border-radius: 16px; max-width: 700px; margin: 10px auto; overflow: hidden; }
  .modal-header { position: relative; }
  .modal-header img { width: 100%; height: 200px; object-fit: cover; }
  .modal-close { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; }
  .modal-body { padding: 18px; }
  .modal-body h2 { font-size: 1.2rem; margin-bottom: 10px; }
  .modal-info { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; font-size: 0.78rem; color: var(--muted); }
  .modal-info span { background: var(--input-bg); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); }
  .genres { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .genre-tag { background: var(--accent); color: white; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; }
  .synopsis { font-size: 0.87rem; line-height: 1.5; margin-bottom: 16px; }
  .section-title { font-size: 0.95rem; margin: 18px 0 10px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .trailer { aspect-ratio: 16/9; width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
  .trailer iframe { width: 100%; height: 100%; border: none; }
  .no-trailer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 20px; background: var(--input-bg); border-radius: 10px; }
  .no-trailer a { color: var(--accent); text-decoration: none; font-weight: bold; display: inline-block; margin-top: 8px; }
  .watchlist-btn { padding: 11px 16px; border-radius: 999px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-weight: bold; cursor: pointer; width: 100%; font-size: 0.9rem; margin-bottom: 8px; }
  .watchlist-btn.in-list { background: var(--accent); color: white; }
  .review-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .review-form input, .review-form textarea { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-family: inherit; font-size: 0.85rem; width: 100%; }
  .review-form textarea { min-height: 60px; resize: vertical; }
  .review-form button { padding: 10px 18px; border-radius: 999px; border: none; background: var(--accent); color: white; font-weight: bold; cursor: pointer; align-self: flex-end; font-size: 0.85rem; }
  .review-item { background: var(--input-bg); padding: 10px 14px; border-radius: 10px; margin-bottom: 8px; font-size: 0.85rem; border: 1px solid var(--border); }
  .review-item strong { color: var(--accent); }
  .review-item .date { color: var(--muted); font-size: 0.7rem; display: block; margin-top: 4px; }
  footer { text-align: center; padding: 20px; color: var(--muted); font-size: 0.78rem; border-top: 1px solid var(--border); margin-top: 40px; }
</style>
</head>
<body>

<header>
  <div class="logo">🌸 AnbiKai Anime<small>Free anime catalog</small></div>
  <div class="header-buttons">
    <button class="icon-btn" id="watchlistBtn" onclick="showWatchlist()">⭐ My List (<span id="wlCount">0</span>)</button>
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="Anime search koro..." autocomplete="off">
      <button class="search-btn" onclick="searchAnime()">Search</button>
    </div>
    <div class="suggestions" id="suggestions"></div>
  </div>
  <select id="genreSelect" onchange="filterGenre()">
    <option value="">All Genres</option>
    <option value="Action">Action</option>
    <option value="Adventure">Adventure</option>
    <option value="Comedy">Comedy</option>
    <option value="Drama">Drama</option>
    <option value="Fantasy">Fantasy</option>
    <option value="Horror">Horror</option>
    <option value="Mystery">Mystery</option>
    <option value="Romance">Romance</option>
    <option value="Sci-Fi">Sci-Fi</option>
    <option value="Slice of Life">Slice of Life</option>
    <option value="Sports">Sports</option>
    <option value="Supernatural">Supernatural</option>
    <option value="Thriller">Thriller</option>
    <option value="Mecha">Mecha</option>
    <option value="Psychological">Psychological</option>
  </select>
</div>

<div id="status"></div>
<div class="section-header">🌟 Featured Anime</div>
<div class="grid" id="featuredGrid"></div>
<div class="section-header" id="trendingHeader" style="display:none;">🔥 Trending Now</div>
<div class="grid" id="animeGrid"></div>

<footer>AnbiKai Anime • Data: AniList API</footer>

<div class="modal-overlay" id="modal" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div class="modal-header">
      <img id="mImg" src="" alt="">
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
var grid = document.getElementById('animeGrid');
var featuredGrid = document.getElementById('featuredGrid');
var trendingHeader = document.getElementById('trendingHeader');
var statusEl = document.getElementById('status');
var input = document.getElementById('searchInput');
var suggestionsEl = document.getElementById('suggestions');
var currentList = [];
var currentView = 'browse';
var suggestTimer = null;

var ANILIST_URL = 'https://graphql.anilist.co';
var QUERY = 'query ($search: String, $genre: String, $sort: [MediaSort], $perPage: Int) { Page(page: 1, perPage: $perPage) { media(type: ANIME, search: $search, genre: $genre, sort: $sort, isAdult: false) { id title { romaji english } description(asHtml: false) coverImage { extraLarge large } bannerImage episodes nextAiringEpisode { episode } averageScore format startDate { year } genres trailer { id site } } } }';

/* ============================================
   ⭐ CUSTOM ANIME — এখানে তুমি নিজের পছন্দের অ্যানিমে যোগ করবে
   mal_id: যেকোনো unique number দাও (আগের সাথে মিল যাবে না)
   title, score, type, episodes, img (cover image URL), synopsis, genres, trailer
   ============================================ */
var customAnime = [
  {
    mal_id: 90001,
    title: "One Piece",
    score: 8.7,
    type: "TV",
    episodes: "1100+",
    img: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx21-ELSYx3QCDY2S.jpg",
    synopsis: "Monkey D. Luffy sets off on an adventure to find the legendary One Piece treasure and become Pirate King.",
    genres: ["Action","Adventure","Fantasy"],
    trailer: "https://www.youtube.com/embed/MCb13lbVGE0",
    year: 1999
  },
  {
    mal_id: 90002,
    title: "Naruto",
    score: 8.0,
    type: "TV",
    episodes: 220,
    img: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx20-ELSYx3QCDY2S.jpg",
    synopsis: "Naruto Uzumaki, a young ninja with a sealed demon fox inside him, seeks recognition and dreams of becoming Hokage.",
    genres: ["Action","Adventure"],
    trailer: "https://www.youtube.com/embed/QczGoCmX-pI",
    year: 2002
  },
  {
    mal_id: 90003,
    title: "Demon Slayer",
    score: 8.5,
    type: "TV",
    episodes: 55,
    img: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx101922-PEn1CTc93blC.jpg",
    synopsis: "Tanjiro becomes a demon slayer to avenge his family and cure his sister.",
    genres: ["Action","Supernatural"],
    trailer: "https://www.youtube.com/embed/VQGCKyvzIM4",
    year: 2019
  },
  {
    mal_id: 90004,
    title: "Attack on Titan",
    score: 8.5,
    type: "TV",
    episodes: 87,
    img: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx16498-C6FPmWm59CyP.jpg",
    synopsis: "Humanity fights for survival against giant man-eating Titans behind enormous walls.",
    genres: ["Action","Drama"],
    trailer: "https://www.youtube.com/embed/LHtdKWJdif4",
    year: 2013
  }
];

var fallbackAnime = customAnime.slice();

/* ===== Fetch with timeout ===== */
function fetchWithTimeout(url, options, ms) {
  options = options || {};
  ms = ms || 8000;
  return new Promise(function(resolve, reject) {
    var controller = new AbortController();
    options.signal = controller.signal;
    var timer = setTimeout(function() { controller.abort(); reject(new Error('timeout')); }, ms);
    fetch(url, options).then(function(res) {
      clearTimeout(timer);
      if (!res.ok) reject(new Error('fail'));
      else resolve(res);
    }).catch(function(e) { clearTimeout(timer); reject(e); });
  });
}

function anilistFetch(variables) {
  return fetchWithTimeout(ANILIST_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({ query: QUERY, variables: variables })
  }, 8000).then(function(res) { return res.json(); });
}

function cleanText(s) {
  if (!s) return '';
  return String(s).replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, '').replace(/&quot;/g, '"').replace(/&#039;/g, "'").replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
}

function mapAniList(a) {
  var trailer = null;
  if (a.trailer && a.trailer.id) {
    if (a.trailer.site === 'youtube') trailer = 'https://www.youtube.com/embed/' + a.trailer.id;
    else if (a.trailer.site === 'dailymotion') trailer = 'https://www.dailymotion.com/embed/video/' + a.trailer.id;
  }
  var eps = a.episodes;
  if (!eps && a.nextAiringEpisode && a.nextAiringEpisode.episode) {
    eps = (a.nextAiringEpisode.episode - 1) + '+';
  }
  if (!eps) eps = '?';
  return {
    mal_id: a.id,
    title: (a.title && (a.title.english || a.title.romaji)) || 'Unknown',
    score: a.averageScore ? (a.averageScore / 10).toFixed(1) : 'N/A',
    type: (a.format || '').replace('_', ' '),
    episodes: eps,
    img: (a.coverImage && (a.coverImage.extraLarge || a.coverImage.large)) || '',
    banner: a.bannerImage || null,
    synopsis: cleanText(a.description),
    genres: a.genres || [],
    trailer: trailer,
    year: (a.startDate && a.startDate.year) || ''
  };
}

/* ===== Sorting for search ===== */
function sortSearchResults(list, query) {
  var q = String(query).toLowerCase().trim();
  function titleScore(a) {
    var t = String(a.title).toLowerCase();
    if (t === q) return 100;
    if (t.startsWith(q + ' ')) return 80;
    if (t.startsWith(q)) return 60;
    if (t.indexOf(q) >= 0) return 40;
    return 20;
  }
  function formatScore(a) {
    var map = { 'TV': 100, 'TV_SHORT': 80, 'ONA': 70, 'OVA': 50, 'SPECIAL': 40, 'MOVIE': 30, 'MUSIC': 10 };
    return map[a.format] || 20;
  }
  list.sort(function(a, b) {
    var aT = titleScore(a), bT = titleScore(b);
    if (aT !== bT) return bT - aT;
    var aF = formatScore(a), bF = formatScore(b);
    if (aF !== bF) return bF - aF;
    var aY = a.year || 9999, bY = b.year || 9999;
    return aY - bY;
  });
  return list;
}

/* ===== Watchlist ===== */
function getWatchlist() { try { return JSON.parse(localStorage.getItem('anbikai_watchlist') || '[]'); } catch(e) { return []; } }
function saveWatchlist(list) { localStorage.setItem('anbikai_watchlist', JSON.stringify(list)); updateWlCount(); }
function updateWlCount() { document.getElementById('wlCount').textContent = getWatchlist().length; }
function isInWatchlist(id) { return getWatchlist().some(function(a){ return a.mal_id === id; }); }
function toggleWatchlist(anime) {
  var list = getWatchlist();
  if (list.some(function(a){ return a.mal_id === anime.mal_id; })) list = list.filter(function(a){ return a.mal_id !== anime.mal_id; });
  else list.push(anime);
  saveWatchlist(list);
}

/* ===== Theme ===== */
function toggleTheme() {
  document.body.classList.toggle('light');
  var isLight = document.body.classList.contains('light');
  document.getElementById('themeBtn').textContent = isLight ? '☀️' : '🌙';
  localStorage.setItem('anbikai_theme', isLight ? 'light' : 'dark');
}
if (localStorage.getItem('anbikai_theme') === 'light') {
  document.body.classList.add('light');
  document.getElementById('themeBtn').textContent = '☀️';
}

/* ===== Render ===== */
function makeCard(a) {
  return '<div class="card" onclick="openDetails(' + a.mal_id + ')">' +
    '<img src="' + a.img + '" alt="" loading="lazy" onerror="this.src=\'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22220%22><rect fill=%22%2323232c%22 width=%22200%22 height=%22220%22/><text x=%22100%22 y=%22110%22 fill=%22%23a1a1aa%22 font-size=%2214%22 text-anchor=%22middle%22>No Image</text></svg>\'">' +
    '<div class="card-content">' +
      '<h3>' + a.title + '</h3>' +
      '<p><span class="score">⭐ ' + a.score + '</span></p>' +
      '<p>' + (a.type || '') + ' • ' + (a.episodes || '?') + ' eps</p>' +
    '</div></div>';
}

function renderAnime(list) {
  currentList = list;
  if (!list || list.length === 0) {
    statusEl.textContent = 'Kono anime paoa gelo na.';
    grid.innerHTML = '';
    return;
  }
  statusEl.textContent = '';
  var html = '';
  for (var i = 0; i < list.length; i++) html += makeCard(list[i]);
  grid.innerHTML = html;
}

function renderFeatured() {
  var html = '';
  for (var i = 0; i < customAnime.length; i++) html += makeCard(customAnime[i]);
  featuredGrid.innerHTML = html;
}

/* ===== Load ===== */
function loadTop() {
  trendingHeader.style.display = 'block';
  statusEl.textContent = '';
  renderFeatured();
  grid.innerHTML = '';
  anilistFetch({ sort: ['TRENDING_DESC'], perPage: 30 }).then(function(res) {
    if (res && res.data && res.data.Page && res.data.Page.media) {
      renderAnime(res.data.Page.media.map(mapAniList));
    }
  }).catch(function() {
    renderAnime(fallbackAnime);
  });
}

function searchAnime() {
  var q = input.value.trim();
  hideSuggestions();
  if (!q) { loadTop(); return; }
  statusEl.textContent = 'Searching...';
  trendingHeader.style.display = 'none';
  grid.innerHTML = '';
  anilistFetch({ search: q, perPage: 30 }).then(function(res) {
    if (res && res.data && res.data.Page && res.data.Page.media && res.data.Page.media.length > 0) {
      var list = res.data.Page.media.map(mapAniList);
      list = sortSearchResults(list, q);
      renderAnime(list);
    } else {
      statusEl.textContent = 'Kichu paoa gelo na.';
      grid.innerHTML = '';
    }
  }).catch(function() {
    statusEl.textContent = 'Search fail. Try again.';
  });
}

function filterGenre() {
  var genre = document.getElementById('genreSelect').value;
  trendingHeader.style.display = 'none';
  if (!genre) { loadTop(); return; }
  statusEl.textContent = 'Filtering ' + genre + '...';
  grid.innerHTML = '';
  anilistFetch({ genre: genre, sort: ['POPULARITY_DESC'], perPage: 30 }).then(function(res) {
    if (res && res.data && res.data.Page && res.data.Page.media) {
      renderAnime(res.data.Page.media.map(mapAniList));
    }
  }).catch(function() {
    statusEl.textContent = 'Filter fail.';
  });
}

function showWatchlist() {
  var btn = document.getElementById('watchlistBtn');
  trendingHeader.style.display = 'none';
  if (currentView === 'watchlist') {
    currentView = 'browse';
    btn.classList.remove('active');
    loadTop();
    return;
  }
  currentView = 'watchlist';
  btn.classList.add('active');
  var list = getWatchlist();
  if (list.length === 0) {
    statusEl.textContent = 'Watchlist khali. Card e tap kore "Add to Watchlist" koro.';
    grid.innerHTML = '';
    return;
  }
  statusEl.textContent = '⭐ Watchlist (' + list.length + ')';
  renderAnime(list);
}

/* ===== SUGGESTIONS ===== */
function hideSuggestions() { suggestionsEl.classList.remove('active'); suggestionsEl.innerHTML = ''; }

function showSuggestions(items) {
  if (!items || items.length === 0) { hideSuggestions(); return; }
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var a = items[i];
    html += '<div class="sug-item" onclick="pickSuggestion(' + a.mal_id + ')">' +
      '<img src="' + a.img + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
      '<div class="sug-item-info">' +
        '<h4>' + a.title + '</h4>' +
        '<p>⭐ ' + a.score + ' • ' + (a.type || '') + ' • ' + (a.episodes || '?') + ' eps' + (a.year ? ' • ' + a.year : '') + '</p>' +
      '</div></div>';
  }
  suggestionsEl.innerHTML = html;
  suggestionsEl.classList.add('active');
}

function pickSuggestion(id) {
  var anime = null;
  for (var i = 0; i < currentList.length; i++) if (currentList[i].mal_id === id) { anime = currentList[i]; break; }
  if (!anime) for (var j = 0; j < customAnime.length; j++) if (customAnime[j].mal_id === id) { anime = customAnime[j]; break; }
  hideSuggestions();
  if (anime) openDetails(anime.mal_id);
}

function fetchSuggestions(q) {
  if (!q || q.length < 1) { hideSuggestions(); return; }
  suggestionsEl.classList.add('active');
  suggestionsEl.innerHTML = '<div class="sug-loading">Loading...</div>';
  anilistFetch({ search: q, perPage: 8 }).then(function(res) {
    if (res && res.data && res.data.Page && res.data.Page.media) {
      var list = res.data.Page.media.map(mapAniList);
      list = sortSearchResults(list, q);
      showSuggestions(list);
    } else {
      hideSuggestions();
    }
  }).catch(function() {
    // Offline fallback: filter custom anime
    var ql = q.toLowerCase();
    var matches = customAnime.filter(function(a){ return a.title.toLowerCase().indexOf(ql) >= 0; });
    if (matches.length > 0) showSuggestions(matches);
    else hideSuggestions();
  });
}

/* ===== Details Modal ===== */
function openDetails(id) {
  var modal = document.getElementById('modal');
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
  var anime = null;
  for (var i = 0; i < currentList.length; i++) if (currentList[i].mal_id === id) { anime = currentList[i]; break; }
  if (!anime) for (var j = 0; j < customAnime.length; j++) if (customAnime[j].mal_id === id) { anime = customAnime[j]; break; }
  if (!anime) return;
  document.getElementById('mImg').src = anime.img;
  renderModal(anime);
}

function renderModal(a) {
  var inList = isInWatchlist(a.mal_id);
  var reviews = getReviews(a.mal_id);
  var body = document.getElementById('modalBody');
  var ytSearch = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(a.title + ' trailer');
  var html = '<h2>' + a.title + '</h2>';
  html += '<div class="modal-info">';
  html += '<span>⭐ ' + a.score + '</span>';
  html += '<span>' + (a.type || 'TV') + '</span>';
  html += '<span>' + a.episodes + ' eps</span>';
  if (a.year) html += '<span>' + a.year + '</span>';
  html += '</div>';
  if (a.genres && a.genres.length) {
    html += '<div class="genres">';
    for (var i = 0; i < a.genres.length; i++) html += '<span class="genre-tag">' + a.genres[i] + '</span>';
    html += '</div>';
  }
  html += '<p class="synopsis">' + (a.synopsis || 'No description available.') + '</p>';
  html += '<button class="watchlist-btn ' + (inList ? 'in-list' : '') + '" onclick="toggleWlFromModal(' + a.mal_id + ')">';
  html += inList ? '✓ In Watchlist — Remove' : '+ Add to Watchlist';
  html += '</button>';
  html += '<h3 class="section-title">📺 Trailer</h3>';
  if (a.trailer) {
    html += '<div class="trailer"><iframe src="' + a.trailer + '" allowfullscreen allow="autoplay; encrypted-media"></iframe></div>';
  } else {
    html += '<div class="no-trailer">Ei anime er trailer paoa gelo na.<br><a href="' + ytSearch + '" target="_blank">▶ YouTube e dekho</a></div>';
  }
  html += '<h3 class="section-title">📝 Reviews (' + reviews.length + ')</h3>';
  html += '<div class="review-form">';
  html += '<input id="revName" type="text" placeholder="Tomar naam...">';
  html += '<textarea id="revText" placeholder="Tomar review likho..."></textarea>';
  html += '<button onclick="submitReview(' + a.mal_id + ')">Post Review</button>';
  html += '</div>';
  for (var k = 0; k < reviews.length; k++) {
    html += '<div class="review-item"><strong>' + escapeHtml(reviews[k].name) + '</strong>';
    html += '<p style="margin-top:4px;">' + escapeHtml(reviews[k].text) + '</p>';
    html += '<span class="date">' + reviews[k].date + '</span></div>';
  }
  body.innerHTML = html;
}

function toggleWlFromModal(id) {
  var anime = null;
  for (var i = 0; i < currentList.length; i++) if (currentList[i].mal_id === id) { anime = currentList[i]; break; }
  if (!anime) for (var j = 0; j < customAnime.length; j++) if (customAnime[j].mal_id === id) { anime = customAnime[j]; break; }
  if (!anime) return;
  toggleWatchlist(anime);
  renderModal(anime);
}

function getReviews(id) { try { return JSON.parse(localStorage.getItem('anbikai_reviews_' + id) || '[]'); } catch(e) { return []; } }
function saveReviews(id, list) { localStorage.setItem('anbikai_reviews_' + id, JSON.stringify(list)); }
function submitReview(id) {
  var name = document.getElementById('revName').value.trim() || 'Anonymous';
  var text = document.getElementById('revText').value.trim();
  if (!text) { alert('Review lekho age!'); return; }
  var list = getReviews(id);
  list.unshift({ name: name, text: text, date: new Date().toLocaleString() });
  saveReviews(id, list);
  var anime = null;
  for (var i = 0; i < currentList.length; i++) if (currentList[i].mal_id === id) { anime = currentList[i]; break; }
  if (!anime) for (var j = 0; j < customAnime.length; j++) if (customAnime[j].mal_id === id) { anime = customAnime[j]; break; }
  if (anime) renderModal(anime);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);
  });
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  document.body.style.overflow = '';
}

/* ===== Init ===== */
input.addEventListener('input', function() {
  var q = input.value.trim();
  clearTimeout(suggestTimer);
  if (q.length < 1) { hideSuggestions(); return; }
  suggestTimer = setTimeout(function() { fetchSuggestions(q); }, 300);
});
input.addEventListener('keypress', function(e) { if (e.key === 'Enter') { hideSuggestions(); searchAnime(); } });
document.addEventListener('click', function(e) {
  if (!e.target.closest('.search-wrap')) hideSuggestions();
});

updateWlCount();
loadTop();
</script>
</body>
